name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        # No GROQ_API_KEY is set here on purpose: the live Planner/Coder
        # chain tests skip gracefully without one, so CI stays free and fast.
        # Add the secret later if we want live-chain tests gated in CI.
        run: pytest
