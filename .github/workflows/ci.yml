name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        # GROQ_API_KEY is passed in from the repo's Actions secret, so the
        # live Planner/Coder/Tester/Reviewer chain tests actually run in CI
        # instead of skipping. If the secret is ever removed, these tests
        # skip gracefully rather than failing.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest