name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 9 */2 * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app to prevent sleep
        run: |
          echo "Pinging devcrew.streamlit.app..."
          status=$(curl -s -o /dev/null -w "%{http_code}" https://devcrew.streamlit.app/)
          echo "Response status: $status"
          if [ "$status" -ne 200 ]; then
            echo "::warning::Streamlit app returned non-200 status ($status) — it may be asleep or down."
          fi